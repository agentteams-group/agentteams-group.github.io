<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">AgentTeams 逻辑架构概览</title>
  <desc id="description">Human 通过 Element Web 或 AgentTeams Dashboard 参与 Matrix（Tuwunel）房间。Matrix 与 Workers、Manager 双向交换消息。Manager 与 Workers 共用 Higress 模型与工具网关以及 MinIO 或 OSS 工作区、状态与产物存储。Dashboard 和 Manager 通过管理 API 访问 Controller，Controller 管理两类 Agent 的生命周期。实线为消息与数据，虚线为资源管理。图中省略部署与代理细节。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M3 2 9 6 3 10" fill="none" stroke="#16875d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="control-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M3 2 9 6 3 10" fill="none" stroke="#6b8795" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #193238; }
      .card { fill: #fff; stroke: #bbd5ca; stroke-width: 1.5; }
      .name { font-size: 29px; font-weight: 600; }
      .detail { font-size: 21px; fill: #51666c; }
      .label { font-size: 19px; fill: #51666c; }
      .flow { fill: none; stroke: #16875d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #6b8795; stroke-width: 2.5; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#control-arrow); }
      .icon { fill: none; stroke: #16875d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #16875d; stroke: none; }
    </style>
    <symbol id="human" viewBox="0 0 64 64">
      <circle cx="32" cy="15" r="10" />
      <path d="M12 57V49a20 20 0 0 1 40 0v8Z" />
    </symbol>
    <symbol id="browser" viewBox="0 0 64 64">
      <rect x="4" y="8" width="56" height="48" rx="6" /><path d="M4 21h56" />
      <circle class="dot" cx="13" cy="15" r="2" /><circle class="dot" cx="21" cy="15" r="2" /><circle class="dot" cx="29" cy="15" r="2" />
    </symbol>
    <symbol id="dashboard" viewBox="0 0 64 64">
      <rect x="4" y="7" width="56" height="50" rx="6" /><path d="M24 7v50M11 19h6m-6 10h6m-6 10h6M32 40h20m-20 8h15" />
      <rect x="32" y="15" width="20" height="16" rx="2" />
    </symbol>
    <symbol id="chat" viewBox="0 0 64 64">
      <path d="M38 21c14 0 24 7 24 18 0 5-3 10-7 13l3 8-11-5c-3 1-6 1-9 1-13 0-23-7-23-17s10-18 23-18Z" />
      <path d="M27 5C14 5 4 12 4 23c0 5 3 9 7 12l-3 12 12-7c2 1 5 1 7 1 13 0 23-7 23-18S40 5 27 5Z" fill="#fff" />
      <circle class="dot" cx="17" cy="23" r="2.5" /><circle class="dot" cx="27" cy="23" r="2.5" /><circle class="dot" cx="37" cy="23" r="2.5" />
      <circle class="dot" cx="51" cy="40" r="2.5" />
    </symbol>
    <symbol id="worker" viewBox="0 0 64 64">
      <rect x="10" y="20" width="44" height="35" rx="10" /><path d="M32 20V11" /><circle cx="32" cy="7" r="4" />
      <path d="M10 29H5v16h5m44-16h5v16h-5" />
      <circle class="dot" cx="24" cy="36" r="3" /><circle class="dot" cx="40" cy="36" r="3" />
    </symbol>
    <symbol id="manager" viewBox="0 0 64 64">
      <rect x="24" y="4" width="16" height="16" rx="3" /><rect x="7" y="43" width="16" height="16" rx="3" /><rect x="41" y="43" width="16" height="16" rx="3" />
      <path d="M32 20v12M15 43V32h34v11" />
    </symbol>
    <symbol id="gateway" viewBox="0 0 64 64">
      <rect x="25" y="15" width="13" height="35" rx="4" /><path d="M2 32h22m-6-6 6 6-6 6M38 25h7l8-9h8m-6-5 6 5-6 5M38 40h7l8 9h8m-6-5 6 5-6 5" />
    </symbol>
    <symbol id="storage" viewBox="0 0 64 64">
      <path d="M7 31 14 21h36l7 10M19 31V5h20l7 7v19M39 5v9h7M25 20h13m-13 6h9" />
      <rect x="7" y="31" width="50" height="28" rx="4" />
    </symbol>
    <symbol id="controller" viewBox="0 0 64 64">
      <path d="M6 23a27 27 0 0 1 47-9l5 8m-1-12 1 12-12-2M58 41a27 27 0 0 1-47 9l-5-8m1 12L6 42l12 2" />
      <rect x="23" y="23" width="18" height="18" rx="3" />
    </symbol>
  </defs>

  <rect width="1440" height="1080" fill="#fff" />
  <text x="720" y="53" text-anchor="middle" font-size="34" font-weight="650">AgentTeams 逻辑架构概览</text>

  <!-- Human and the two distinct interaction entry points. -->
  <rect class="card" x="365" y="98" width="400" height="100" rx="50" />
  <use href="#human" class="icon" x="405" y="116" width="64" height="64" />
  <text class="name" x="490" y="140">Human</text>
  <text class="detail" x="490" y="173">Human-in-the-loop</text>
  <path class="flow" d="M565 200v12q0 12-12 12H317q-12 0-12 12v5" marker-end="url(#arrow)" />
  <path class="flow" d="M565 212q0 12 12 12h221q12 0 12 12v5" marker-end="url(#arrow)" />

  <rect class="card" x="80" y="245" width="450" height="108" rx="20" />
  <use href="#browser" class="icon" x="110" y="267" width="64" height="64" />
  <text class="name" x="195" y="291">Element Web</text>
  <text class="detail" x="195" y="326">Matrix 客户端</text>
  <rect class="card" x="570" y="245" width="480" height="108" rx="20" />
  <use href="#dashboard" class="icon" x="600" y="267" width="64" height="64" />
  <text x="685" y="291" font-size="27" font-weight="600">AgentTeams Dashboard</text>
  <text class="detail" x="685" y="326">团队 · 任务 · 聊天</text>
  <path class="flow" d="M305 359v50" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path class="flow" d="M810 359v50" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <rect class="card" x="80" y="415" width="970" height="100" rx="20" />
  <use href="#chat" class="icon" x="385" y="433" width="64" height="64" />
  <text class="name" x="475" y="455">Matrix（Tuwunel）</text>
  <text class="detail" x="475" y="489">共享房间 · 消息协作</text>

  <!-- A complete Agent group; return messages point up at the Matrix endpoint. -->
  <rect x="80" y="565" width="970" height="192" rx="24" fill="#edf8f2" />
  <text x="106" y="598" font-size="23" font-weight="600" style="fill:#16875d">Agent 团队</text>
  <path class="flow" d="M565 520v50q0 12-12 12H332q-12 0-12 12v25" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path class="flow" d="M565 570q0 12 12 12h221q12 0 12 12v25" marker-end="url(#arrow)" />

  <rect class="card" x="110" y="625" width="420" height="102" rx="18" />
  <use href="#worker" class="icon" x="140" y="644" width="64" height="64" />
  <text class="name" x="225" y="668">Workers</text>
  <text class="detail" x="225" y="703">任务执行 · 多运行时</text>
  <rect class="card" x="600" y="625" width="420" height="102" rx="18" />
  <use href="#manager" class="icon" x="630" y="644" width="64" height="64" />
  <text class="name" x="715" y="668">Manager</text>
  <text class="detail" x="715" y="703">任务规划与协调</text>

  <!-- Management stays in the right gutter, independent of the message paths. -->
  <rect class="card" x="1190" y="435" width="210" height="300" rx="22" />
  <use href="#controller" class="icon" x="1263" y="465" width="64" height="64" />
  <text class="name" x="1295" y="568" text-anchor="middle">Controller</text>
  <text x="1295" y="604" text-anchor="middle" font-size="18" style="fill:#51666c">资源管理 · 生命周期</text>
  <text class="label" x="1295" y="657" text-anchor="middle">管理对象：</text>
  <text x="1295" y="687" text-anchor="middle" font-size="19">Manager / Workers</text>
  <path class="control" d="M1055 299h224q16 0 16 16v114" />
  <text class="label" x="1150" y="279" text-anchor="middle">管理 API</text>
  <path class="control" d="M1185 588h-130" />
  <text class="label" x="1120" y="570" text-anchor="middle">生命周期</text>
  <path class="control" d="M1025 676h160" />
  <text class="label" x="1107" y="658" text-anchor="middle">管理 API</text>

  <!-- Shared dependency lines are relationships, not an additional service. -->
  <path class="flow" d="M320 729v86M810 729v86M230 815h715" />
  <text x="565" y="796" text-anchor="middle" font-size="20">共享依赖（模型、工具与存储）</text>
  <path class="flow" d="M305 815v79" marker-end="url(#arrow)" />
  <text class="label" x="335" y="860">调用 · LLM / MCP</text>
  <path class="flow" d="M810 822v72" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="label" x="837" y="860">读写</text>
  <rect class="card" x="80" y="900" width="450" height="100" rx="20" />
  <use href="#gateway" class="icon" x="110" y="918" width="64" height="64" />
  <text class="name" x="195" y="942">Higress</text>
  <text class="detail" x="195" y="976">模型与工具网关</text>
  <rect class="card" x="600" y="900" width="450" height="100" rx="20" />
  <use href="#storage" class="icon" x="630" y="918" width="64" height="64" />
  <text class="name" x="715" y="942">MinIO / OSS</text>
  <text class="detail" x="715" y="976">工作区 · 状态 · 产物</text>

  <path class="flow" d="M260 1040h40" />
  <text x="315" y="1046" font-size="18" style="fill:#51666c">实线：消息与数据</text>
  <path d="M550 1040h40" fill="none" stroke="#6b8795" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" />
  <text x="605" y="1046" font-size="18" style="fill:#51666c">虚线：资源管理</text>
  <text x="825" y="1046" font-size="18" style="fill:#51666c">逻辑关系，省略部署与代理细节</text>
</svg>
